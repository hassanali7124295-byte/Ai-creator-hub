name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Generate android/ with flutter create
        run: flutter create --platforms=android --org com.aicreatorhub --project-name ai_creator_hub .

      - name: Rename Android package to com.pakai.ai (Step 20)
        # `flutter create` above always scaffolds android/ fresh with the
        # org/project-name applicationId (com.aicreatorhub.ai_creator_hub).
        # Since android/ isn't committed, this step must re-apply the
        # rename on every single build for it to actually be permanent —
        # same pattern as the android:label and RECORD_AUDIO patches
        # below. Renames applicationId + namespace in build.gradle.kts,
        # moves MainActivity.kt into the new package folder, and updates
        # its `package` declaration. The Dart package name in
        # pubspec.yaml (ai_creator_hub) is untouched — Android's
        # applicationId/namespace and Flutter's Dart package name are
        # independent, so lib/** imports are unaffected.
        run: |
          set -e
          OLD_PKG="com.aicreatorhub.ai_creator_hub"
          NEW_PKG="com.pakai.ai"
          OLD_DIR="android/app/src/main/kotlin/com/aicreatorhub/ai_creator_hub"
          NEW_DIR="android/app/src/main/kotlin/com/pakai/ai"
          GRADLE_FILE="android/app/build.gradle.kts"
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          test -f "$GRADLE_FILE" || { echo "::error::$GRADLE_FILE not found — flutter create output may have changed"; exit 1; }
          test -f "$OLD_DIR/MainActivity.kt" || { echo "::error::$OLD_DIR/MainActivity.kt not found — flutter create output may have changed"; exit 1; }

          # 1. applicationId + namespace in build.gradle.kts.
          sed -i "s/$OLD_PKG/$NEW_PKG/g" "$GRADLE_FILE"

          # 2. Move MainActivity.kt into the new package folder and update
          #    its package declaration.
          mkdir -p "$NEW_DIR"
          mv "$OLD_DIR/MainActivity.kt" "$NEW_DIR/MainActivity.kt"
          sed -i "s/^package .*/package $NEW_PKG/" "$NEW_DIR/MainActivity.kt"
          # Clean up the now-empty old package folders.
          rmdir "android/app/src/main/kotlin/com/aicreatorhub/ai_creator_hub" 2>/dev/null || true
          rmdir "android/app/src/main/kotlin/com/aicreatorhub" 2>/dev/null || true

          # 3. Legacy AndroidManifest.xml `package="..."` attribute, if the
          #    template ever includes one (modern AGP sets namespace via
          #    Gradle only, so this is usually a no-op — kept defensive).
          if grep -q "package=\"$OLD_PKG\"" "$MANIFEST_FILE" 2>/dev/null; then
            sed -i "s/package=\"$OLD_PKG\"/package=\"$NEW_PKG\"/" "$MANIFEST_FILE"
          fi

          echo "--- Verification ---"
          grep -n "applicationId\|namespace" "$GRADLE_FILE"
          grep -n "^package" "$NEW_DIR/MainActivity.kt"
          find android/app/src/main/kotlin -type f

      - name: Install dependencies
        run: flutter pub get

      - name: Set app display name to "Pak AI"
        # `flutter create` always writes android:label from --project-name,
        # so every fresh android/ needs this patched back to the real
        # user-visible app name before we build.
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Pak AI"/' \
            android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Add microphone permission for voice input (Step 18.5)
        # `flutter create` doesn't declare RECORD_AUDIO, so every fresh
        # android/ needs it added before build — required for the mic
        # button's speech_to_text session to work at runtime.
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
            android/app/src/main/AndroidManifest.xml
          grep -n 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Generate Pak AI launcher icon
        # Writes the adaptive icon (mipmap-anydpi-v26 + all mipmap-*dpi
        # foreground/background PNGs) into the android/ that flutter create
        # just generated, from assets/icon/icon*.png.
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pak-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
