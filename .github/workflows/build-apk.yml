name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.44.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Generate android/ with flutter create
        run: flutter create --platforms=android --org com.aicreatorhub --project-name ai_creator_hub .

      - name: Install dependencies
        run: flutter pub get

      - name: Set app display name to "Pak AI"
        # `flutter create` always writes android:label from --project-name,
        # so every fresh android/ needs this patched back to the real
        # user-visible app name before we build.
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Pak AI"/' \
            android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Add microphone permission for voice input (Step 18.5)
        # `flutter create` doesn't declare RECORD_AUDIO, so every fresh
        # android/ needs it added before build — required for the mic
        # button's speech_to_text session to work at runtime.
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' \
            android/app/src/main/AndroidManifest.xml
          grep -n 'RECORD_AUDIO' android/app/src/main/AndroidManifest.xml

      - name: Generate Pak AI launcher icon
        # Writes the adaptive icon (mipmap-anydpi-v26 + all mipmap-*dpi
        # foreground/background PNGs) into the android/ that flutter create
        # just generated, from assets/icon/icon*.png.
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pak-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
