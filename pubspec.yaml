name: ai_creator_hub
description: "Pak AI - a clean, modern AI chat assistant with selectable AI Modes, conversation history, and Gemini-powered chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking (Gemini chat API calls)
  http: ^1.2.1

  # Local persistence (theme mode, user prefs, cached data)
  shared_preferences: ^2.2.3

  # Nice UI extras
  google_fonts: ^6.2.1
  animate_do: ^3.3.4

  # Markdown rendering for AI chat replies (flutter_markdown is discontinued;
  # this is the actively-maintained community continuation).
  flutter_markdown_plus: ^1.0.10

  # Chat attachment picker (Step 8): Gallery / Camera / Document / File.
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Attachment pipeline (Step 9): send picked files to Gemini.
  # Both are pure-Dart — no native/platform code, no manifest changes.
  mime: ^1.0.5            # detect attachment mime type from file name
  image: ^4.2.0            # decode/resize/re-encode image attachments before upload

  # Chat UI actions (Step 10): Share and Read Aloud on AI responses.
  share_plus: ^10.1.3      # native share sheet for the "Share" action
  flutter_tts: ^4.2.0      # on-device text-to-speech for "Read Aloud"

  # Step 18.5: on-device speech-to-text for the composer's mic button —
  # handles the OS mic-permission prompt itself via initialize().
  speech_to_text: ^7.0.0

  # Step 17: Rate App (Play Store deep link) and outbound links from the
  # About / Privacy Policy screens.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Step 17: generates the Android adaptive launcher icon (foreground +
  # background layers below) from our premium Pak AI icon assets. Run via
  # `dart run flutter_launcher_icons` — wired into the CI workflow right
  # after `flutter create` regenerates android/, since that's the only
  # place the mipmap folders exist for it to write into.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# Step 17: premium "Pak AI" launcher icon — black + emerald glassmorphism
# chat-bubble-merged-with-P mark. icon.png is the flat/legacy icon (used
# on iOS and pre-Android-8 devices); icon_foreground.png / icon_background
# .png form the Android 8+ adaptive icon (the bubble+P mark alone sits in
# the foreground layer so the OS can mask/animate it independently of the
# gradient background).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
