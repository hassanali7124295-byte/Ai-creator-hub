name: ai_creator_hub
description: "Pak AI - a clean, modern AI chat assistant with selectable AI Modes, conversation history, and Gemini-powered chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking (Gemini chat API calls)
  http: ^1.2.1

  # Local persistence (theme mode, user prefs, cached data)
  shared_preferences: ^2.2.3

  # Nice UI extras
  google_fonts: ^6.2.1
  animate_do: ^3.3.4

  # Markdown rendering for AI chat replies (flutter_markdown is discontinued;
  # this is the actively-maintained community continuation).
  flutter_markdown_plus: ^1.0.10

  # Chat attachment picker (Step 8): Gallery / Camera / Document / File.
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Attachment pipeline (Step 9): send picked files to Gemini.
  # Both are pure-Dart — no native/platform code, no manifest changes.
  mime: ^1.0.5            # detect attachment mime type from file name
  image: ^4.2.0            # decode/resize/re-encode image attachments before upload

  # Step 22A: on-device PDF text extraction for the "PDF attachment" flow —
  # pure-Dart (no native/platform code, no manifest changes), used only for
  # `PdfDocument` + `PdfTextExtractor`.
  # Step 56: also reused (no new package added) to *write* PDFs for the new
  # AI Q&A -> PDF export feature — `PdfDocument`/`PdfPage`/`PdfTextElement`
  # from this same package. See `pdf_export_service.dart`.
  syncfusion_flutter_pdf: ^24.1.41

  # Chat UI actions (Step 10): Share and Read Aloud on AI responses.
  share_plus: ^10.1.3      # native share sheet for the "Share" action
  flutter_tts: ^4.2.0      # on-device text-to-speech for "Read Aloud"

  # Step 60: real "Download PDF" (as opposed to Share, which already used
  # share_plus above). Saves bytes straight into the device's Downloads
  # via Android's scoped-storage-safe MediaStore APIs internally — no
  # manual filesystem/permission handling needed, no server, no paid
  # service. Small, free, open-source, MIT-licensed.
  file_saver: ^0.2.14

  # Step 18.5: continuous speech recognition service — no longer wired to
  # the chat composer's mic button as of Step 43 (see
  # `lib/core/services/voice_input_service.dart`), kept in the project
  # since nothing else was asked to be removed and a future step may still
  # want dictation elsewhere.
  speech_to_text: ^7.0.0

  # Step 43 — Proper Voice Message System: the mic button now records real
  # audio instead of transcribing speech. `record` handles the actual
  # microphone capture (and, like `speech_to_text` above, its own mic
  # permission prompt via its bundled Android/iOS manifest entries — no
  # manual manifest edit needed). `audioplayers` plays the resulting file
  # back for the in-composer preview and for sent voice-message bubbles.
  # `path_provider` is only used to pick a writable temp-file location for
  # each new recording.
  # Step 44: bumped from ^5.1.2 — the old constraint resolved to
  # record_linux 0.7.2, which is missing an interface member
  # (`startStream`) added by a newer record_platform_interface and fails
  # to compile. record ^6.2.1 resolves a record_linux release that
  # implements the full interface. No API usage in
  # voice_recorder_service.dart changed (it already used the
  # AudioRecorder/RecordConfig/aacLc surface that 6.2.1 also uses).
  record: ^6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Step 17: Rate App (Play Store deep link) and outbound links from the
  # About / Privacy Policy screens.
  url_launcher: ^6.3.1

  # Step 19.3: real Google Sign-In (official Google account picker) —
  # replaces the "Coming soon" placeholder on the Welcome screen.
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Step 17: generates the Android adaptive launcher icon (foreground +
  # background layers below) from our premium Pak AI icon assets. Run via
  # `dart run flutter_launcher_icons` — wired into the CI workflow right
  # after `flutter create` regenerates android/, since that's the only
  # place the mipmap folders exist for it to write into.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# Step 17: premium "Pak AI" launcher icon — black + emerald glassmorphism
# chat-bubble-merged-with-P mark. icon.png is the flat/legacy icon (used
# on iOS and pre-Android-8 devices); icon_foreground.png / icon_background
# .png form the Android 8+ adaptive icon (the bubble+P mark alone sits in
# the foreground layer so the OS can mask/animate it independently of the
# gradient background).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
